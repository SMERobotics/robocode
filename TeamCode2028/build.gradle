//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            url = providers.gradleProperty('dairyMavenUrl').getOrElse('https://repo.dairy.foundation/releases')
            allowInsecureProtocol = url.host in ['127.0.0.1', 'localhost']
        }
    }
    dependencies {
        classpath('dev.frozenmilk:Load:0.3.2') {
            // Use the Android plugin selected by the root project.
            exclude group: 'com.android.tools.build', module: 'gradle'
        }
    }
}

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'
apply from: 'sloth.gradle'

load {
    autoconnect = dev.frozenmilk.sinister.sloth.AutoConnect.valueOf('NEVER')
}

android {
    namespace = 'org.technodot.ftc.twentysix'

    compileSdk 36
    defaultConfig {
        minSdk 24
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
//    mavenLocal()
    maven {
        url = 'https://maven.brott.dev/'
    }
    // Resolve Sloth and its forks directly from their publisher.
    exclusiveContent {
        forRepository {
            maven {
                url = providers.gradleProperty('dairyMavenUrl').getOrElse('https://repo.dairy.foundation/releases')
                // Permit a local relay without allowing unencrypted remote mirrors.
                allowInsecureProtocol = url.host in ['127.0.0.1', 'localhost']
            }
        }
        filter {
            includeGroupAndSubgroups 'dev.frozenmilk'
            includeGroup 'com.acmerobotics.slothboard'
            includeGroup 'com.bylazar.sloth'
        }
    }
    mavenCentral()
}

// These libraries retain their Java packages in the Sloth-compatible forks.
// Exclude their originals even when another dependency brings them in.
configurations.configureEach {
    exclude group: 'com.acmerobotics.dashboard'
    exclude group: 'com.bylazar'
}

dependencies {
    implementation project(':FtcRobotController')

    implementation 'com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0'
    implementation('com.bylazar.sloth:fullpanels:0.3.2+1.0.13') {
        // Dashboard already serves these ports; a second proxy crashes Panels.
        exclude group: 'com.bylazar.sloth', module: 'limelightproxy'
    }

    implementation 'com.pedropathing:ftc:2.0.5'
    implementation 'com.pedropathing:telemetry:1.0.0'

    implementation 'dev.frozenmilk.sinister:Sloth:0.3.2'
}
